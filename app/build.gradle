import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }

android {
    namespace 'com.skt.visionpulse'
    compileSdk 36

    signingConfigs {
        commonStable {
            storeFile rootProject.file('ci/skt-common-signing.jks')
            storePassword '2048td-release'
            keyAlias '2048td-release'
            keyPassword '2048td-release'
        }
    }

    defaultConfig {
        applicationId 'com.skt.visionpulse'
        minSdk 26
        targetSdk 35
        versionCode versionProps['VERSION_CODE'].toInteger()
        versionName versionProps['VERSION_NAME']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.commonStable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.commonStable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'

    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.patrykandpatrick.vico:compose:3.2.3'
    implementation 'com.patrykandpatrick.vico:compose-m3:3.2.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'

    testImplementation 'junit:junit:4.13.2'
}

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visionpulse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Export YOLO26n ONNX model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tools/export_model.py
          test -s app/src/main/assets/yolo26n.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Collect verification evidence
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/VisionPulse-v0.1.0-debug.apk
          sha256sum artifact/VisionPulse-v0.1.0-debug.apk | tee artifact/VisionPulse-v0.1.0-debug.apk.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs artifact/VisionPulse-v0.1.0-debug.apk | tee artifact/signing-certificate.txt
          cat > artifact/build-metadata.txt <<META
          repository=${{ github.repository }}
          branch=${{ github.ref_name }}
          commit=${{ github.sha }}
          versionName=0.1.0
          versionCode=1
          build=:app:testDebugUnitTest :app:assembleDebug
          model=yolo26n.pt -> ONNX dynamic nms=False
          META

      - uses: actions/upload-artifact@v4
        with:
          name: VisionPulse-v0.1.0-debug
          path: artifact/
          if-no-files-found: error
